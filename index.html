      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
    }
    .btn img {
      height: 22px;
      width: auto;
      display: block;
    }
    .btn span {
      white-space: nowrap;
    }
    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.16);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    @media (min-width: 700px) {
      .page {
        max-width: 640px;

      }

        max-height: 70vh;
